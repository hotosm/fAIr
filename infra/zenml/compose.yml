services:
  zenml:
    build:
      context: .
      dockerfile: Dockerfile.postgres
      args:
        ZENML_VERSION: 0.94.1
    image: ghcr.io/hotosm/zenml-postgres:0.94.1
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - ZENML_STORE_URL=postgresql://zenml:zenml@postgres:5432/zenml
      - ZENML_STORE_TYPE=sql
      - ZENML_STORE_BACKUP_STRATEGY=disabled
      - ZENML_DEBUG=true
      - ZENML_LOGGING_VERBOSITY=DEBUG
    volumes:
      - ./patch_zenml.py:/zenml/patch_zenml.py
      - ./verify_postgres_setup.py:/zenml/verify_postgres_setup.py
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "zenml migrate-database &&
               uvicorn zenml.zen_server.zen_server_api:app --host 0.0.0.0 --port 8080"

  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=zenml
      - POSTGRES_PASSWORD=zenml
      - POSTGRES_DB=zenml
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenml -d zenml"]
      interval: 5s
      timeout: 5s
      retries: 5
