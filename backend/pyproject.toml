[project]
name = "fAIr"
version = "1.0.1"
description = "AI Assisted Mapping"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0 license"}
authors = [
    {name = "HOTOSM", email = "sysadmin@hotosm.org"},
]
dependencies = [
    "httpx>=0.28.1",
    "osmconflator>=0.0.11",
    "python-ulid>=3.1.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[tool.uv]
default-groups = ["api"]

[dependency-groups]
api = [
    "boto3>=1.37.38",
    "celery>=5.5.2",
    "dj-database-url>=2.3.0",
    "django>=4.2.21",
    "django-celery-results>=2.6.0",
    "django-cors-headers>=4.4.0",
    "django-environ>=0.11.2",
    "django-filter>=24.3",
    "django-leaflet>=0.31.0",
    "django-q2>=1.7.6",
    "django-ratelimit>=4.1.0",
    "django-redis>=5.4.0",
    "djangorestframework>=3.15.2",
    "djangorestframework-gis>=1.0",
    "drf-spectacular>=0.29.0",
    "flower>=2.0.1",
    "geojson2osm>=0.0.1",
    "geomltoolkits>=0.4.2",
    "geopandas>=0.13.2",
    "gpxpy>=1.6.2",
    "gunicorn>=23.0.0",
    "hotosm-auth @ git+https://github.com/hotosm/login.git@auth-libs-v0.2.4#subdirectory=auth-libs/python",
    "mercantile>=1.2.1",
    "numpy>=1.24.4",
    "osm-login-python>=1.0.0",
    "psycopg2>=2.9.10",
    "pyarrow>=21.0.0",
    "pyogrio>=0.6.0, <0.7.0",
    "rasterio>=1.3.11",
    "redis>=6.0.0",
    "validators>=0.34.0",
]

dev = [
    "commitizen>=3.31.0",
]
test = [
    "coverage>=7.10.7",
    "factory-boy>=3.3.3",
    "pytest-django>=4.5.2",
    "responses>=0.25.8",
]
base-workers = [
    "hot-fair-utilities>=2.0.12",
    "tippecanoe>=2.72.0",
    "watchdog>=6.0.0",
]
ramp-workers = [
    "numpy>=1.24.4,<2",
    "protobuf>=3.19.6,<4",
    "shapely>=1.8.0,<2",
]
yolo-workers = [
]
prediction-workers = [
    "fairpredictor>=0.3.12",
    "tippecanoe>=2.72.0",
]

