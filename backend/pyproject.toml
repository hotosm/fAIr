[project]
name = "fair-backend"
version = "2.0.0"
description = "AI-Assisted Mapping backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "HOTOSM", email = "sysadmin@hotosm.org" }]
maintainers = [{ name = "Kshitij Raj Sharma", email = "krschap@proton.me" }]

dependencies = [
    "adrf>=0.1.12",
    "boto3>=1.40",
    "dj-database-url>=2.3",
    "django>=6.0,<6.1",
    "django-cors-headers>=4.6",
    "django-filter>=24.3",
    "django-tasks>=0.12",
    "django-tasks-db>=0.5",
    "djangorestframework>=3.15",
    "djangorestframework-gis>=1.1",
    "drf-spectacular>=0.29",
    "fair-py-ops[k8s]==0.3.2",
    "geomltoolkits>=2.1.0",
    "geopandas>=1.0",
    "gpxpy>=1.6",
    "gunicorn>=23.0",
    "hotosm-auth[django]==0.2.12",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyogrio>=0.10",
    "python-ulid>=3.1",
    "shapely>=2.0",
    "whitenoise>=6.6",
]

[dependency-groups]
dev = ["commitizen>=4.10", "pre-commit>=4.0", "ruff>=0.15", "ty==0.0.1a23"]
sentry = ["sentry-sdk>=2.59.0"]
test = ["coverage>=7.10", "pytest-django>=4.5", "responses>=0.25"]

[tool.uv]
package = false
default-groups = ["dev", "test"]
override-dependencies = ["pyjwt[crypto]>=2.8.0,<3"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "**/migrations/**",
    "shared/integrations/mapswipe.py",
    "tests/**",
    "login/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF012 (mutable defaults) is over-eager for Django ORM:
# `list_display = [...]`, `Meta.indexes = [...]`, etc. Django expects these as class
# attrs; they're not the Python anti-pattern RUF012 is targeting.
ignore = ["RUF012"]

[tool.ty.environment]
root = ["."]

[tool.ty.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"
possibly-missing-implicit-call = "ignore"
deprecated = "ignore"
missing-argument = "ignore"

[tool.ty.src]
exclude = [
    "**/migrations/**",
    "**/tests/**",
    "shared/integrations/mapswipe.py",
    "login/**",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = [
    "datasets",
    "feedback",
    "login",
    "modelregistry",
    "notifications",
    "prediction",
    "shared",
    "system",
    "training",
    "workspace",
    "config",
]
omit = ["**/migrations/**", "**/tests/**"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = false
