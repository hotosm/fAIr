name: Backend lint and tests

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/test_backend_build.yml"
      - ".pre-commit-config.yaml"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/test_backend_build.yml"
      - ".pre-commit-config.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run pre-commit
        run: uv run --directory backend pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports:
          - 6379:6379
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install gdal
        run: |
          sudo apt-get update
          sudo apt-get -y install gdal-bin libgdal-dev python3-gdal
          sudo apt-get -y autoremove
          sudo apt-get clean

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgis://admin:password@localhost:5432/ai" >> $GITHUB_ENV
          echo "TRAINING_WORKSPACE=${{ github.workspace }}/backend/training" >> $GITHUB_ENV

      - name: Run migrations and tests
        env:
          TESTING_TOKEN: ${{ secrets.TESTING_TOKEN }}
          OSM_CLIENT_ID: ${{ secrets.OSM_CLIENT_ID }}
          OSM_CLIENT_SECRET: ${{ secrets.OSM_CLIENT_SECRET }}
          OSM_SECRET_KEY: ${{ secrets.OSM_SECRET_KEY }}
          SECRET_KEY: TEST_DJANGO_APP_SECRET_KEY
          DEBUG: "True"
          FRONTEND_URL: http://localhost:3500
          API_BASE_URL: http://localhost:8000/api/v1
        working-directory: ./backend
        run: |
          uv run python manage.py makemigrations
          uv run python manage.py migrate
          uv run coverage run manage.py test tests
