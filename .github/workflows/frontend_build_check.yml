name: Frontend Build

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_build.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend_build.yml"

jobs:
  frontend-unit-test:
    uses: hotosm/gh-workflows/.github/workflows/test_pnpm.yml@4.0.3
    with:
      working_dir: frontend
  Build_On_Ubuntu:
    runs-on: ubuntu-latest
    needs: [frontend-unit-test]
    env:
      CI: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Cache pnpm store
        uses: actions/cache@v4
        id: pnpm-cache
        with:
          # Caches the pnpm store which is used to save downloaded packages
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node.js dependencies
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ./frontend
        run: pnpm run build

  # Build-only checks for PRs. Push happens in docker_publish_image.yml on
  # merge to main/stage/develop.
  docker-build-dev:
    needs: [frontend-unit-test]
    uses: hotosm/gh-workflows/.github/workflows/image_build.yml@4.0.3
    with:
      context: frontend/
      dockerfile: Dockerfile.dev
      image_name: ghcr.io/${{ github.repository_owner }}/fair/frontend
      push: false

  docker-build-prod:
    needs: [frontend-unit-test]
    uses: hotosm/gh-workflows/.github/workflows/image_build.yml@4.0.3
    with:
      context: frontend/
      dockerfile: Dockerfile.prod
      image_name: ghcr.io/${{ github.repository_owner }}/fair/frontend
      push: false
