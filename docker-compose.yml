version: "3.8"

services:
  postgres:
    restart: always
    image: postgis/postgis
    container_name: pgsql
    environment:
      - POSTGRES_DB=ai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"

  backend-api:
    # image: ghcr.io/hotosm/fair_api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.API
    container_name: api
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./backend/.env
    ports:
      - 8000:8000
    volumes:
      # - ./backend:/app
      - ${RAMP_HOME}:/RAMP_HOME
      - ${TRAINING_WORKSPACE}:/TRAINING_WORKSPACE
    depends_on:
      - redis
      - postgres

  backend-worker:
    # image: ghcr.io/hotosm/fair_worker:latest_gpu
    build:
      context: ./backend
      dockerfile: Dockerfile.workers
    container_name: worker
    command: celery -A aiproject worker --loglevel=INFO --concurrency=1 -Q ramp_training,yolo_training
    env_file:
      - ./backend/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    volumes:
      # - ./backend:/app
      - ${RAMP_HOME}:/RAMP_HOME
      - ${TRAINING_WORKSPACE}:/TRAINING_WORKSPACE
    depends_on:
      - backend-api
      - redis
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    command: pnpm run dev --host 0.0.0.0 --port 3000
    ports:
      - 3000:3000
    depends_on:
      - backend-api
