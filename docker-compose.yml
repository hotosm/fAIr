services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-fair}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-admin}", "-d", "${POSTGRES_DB:-fair}"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend-assets:
    image: ghcr.io/hotosm/fair-frontend:develop
    volumes:
      - frontend_html:/frontend_html

  api:
    image: ghcr.io/hotosm/fair-api:develop
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      SERVE_FRONTEND: "true"
      FRONTEND_DIST_DIR: /frontend_html
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      frontend-assets:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - /app/.venv
      - frontend_html:/frontend_html
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  worker:
    image: ghcr.io/hotosm/fair-api:develop
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv
    command: ["python", "manage.py", "db_worker"]
volumes:
  postgres_data:
  frontend_html:
