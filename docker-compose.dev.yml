name: fair

x-common-env: &common-env
  env_file:
    - .env.dev

x-common-volumes: &common-volumes
  volumes:
    - ./fair-app-data/log:/app/log
    - ./fair-app-data/ramp:/ramp
    - ./fair-app-data/trainings:/trainings
    - ./backend/core:/app/core
    - ./backend/login:/app/login
    - ./backend/fairproject:/app/fairproject

services:
  postgres:
    <<: *common-env
    image: postgis/postgis:17-3.5-alpine
    container_name: fair-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - ./fair-app-data/postgres:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - fair-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *common-env
    image: redis:8-alpine
    container_name: fair-redis
    volumes:
      - ./fair-app-data/redis:/data
    ports:
      - "6378:6379"
    networks:
      - fair-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: [*common-env, *common-volumes]
    build:
      context: ./backend
      dockerfile: Dockerfile.API
    container_name: fair-api
    command: python manage.py runserver_with_q 0.0.0.0:8000
    ports:
      - "8200:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fair-network

  worker-cpu:
    <<: [*common-env, *common-volumes]
    profiles: ["cpu"]
    build:
      context: ./backend
      dockerfile: Dockerfile.workers
      args:
        BUILD_TYPE: cpu
    container_name: fair-worker-cpu
    command: watchmedo auto-restart -d /app -p '*.py' --recursive -- celery -A fairproject worker --loglevel=INFO --concurrency=1 -Q ramp_training,yolo_training
    depends_on:
      - api
    networks:
      - fair-network

  worker-gpu:
    <<: [*common-env, *common-volumes]
    profiles: ["gpu"]
    build:
      context: ./backend
      dockerfile: Dockerfile.workers
      args:
        BUILD_TYPE: gpu
    container_name: fair-worker-gpu
    command: watchmedo auto-restart -d /app -p '*.py' --recursive -- celery -A fairproject worker --loglevel=INFO --concurrency=1 -Q ramp_training,yolo_training --pool=solo
    depends_on:
      - api
    networks:
      - fair-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  predictor:
    <<: [*common-env, *common-volumes]
    build:
      context: ./backend
      dockerfile: Dockerfile.API
      args:
        BUILD_TARGET: predictor
    container_name: fair-predictor
    command: celery -A fairproject worker --loglevel=INFO --concurrency=1 -Q predictions --pool=solo
    depends_on:
      - api
    networks:
      - fair-network

  frontend:
    <<: *common-env
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: fair-frontend
    command: pnpm run dev --host 0.0.0.0 --port 3000
    ports:
      - "3500:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - fair-network
    depends_on:
      - api

networks:
  fair-network:
    name: fair-network
    driver: bridge
