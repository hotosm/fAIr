# -- Number of backend replicas
backendReplicaCount: 1

image:
  backend:
    repository: ghcr.io/hotosm/fair-api
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Backend (Django API) configuration
backend:
  command:
    - gunicorn
    - --bind=0.0.0.0:8000
    - --workers=3
    - --timeout=120
    - config.wsgi:application

  # -- Run Django-Q cluster as a sidecar for lightweight async tasks
  djangoQ:
    enabled: true
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi

  port: 8000

  env: {}
    # DJANGO_SECRET_KEY: ""
    # DJANGO_ALLOWED_HOSTS: "*"
    # OSM_CLIENT_ID: ""
    # OSM_CLIENT_SECRET: ""
    # OSM_SECRET_KEY: ""

  # -- Reference an existing Secret for sensitive env vars
  envFrom: []
    # - secretRef:
    #     name: fair-backend-secrets

  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    httpGet:
      path: /api
      port: http
      httpHeaders:
      - name: Host
        value: localhost
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /api
      port: http
      httpHeaders: # use localhost rather than hosts IP
      - name: Host
        value: localhost
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

  # -- Run Django migrations as a pre-install/upgrade hook
  migrate:
    enabled: true

  service:
    type: ClusterIP
    port: 8000

# -- Frontend deployment. The SPA comes from the fair-frontend image, which runs
# as an init container (copies assets into a shared volume and exits; not a web
# server). See frontend/Dockerfile.prod. Two mutually exclusive modes:
#   "bundleWithBackend" - Django/WhiteNoise serves the SPA at `/`, same origin as
#                         the API. Sets SERVE_FRONTEND=true automatically. Default.
#   "cloudfront"        - a Helm Job syncs the SPA to S3 + CloudFront, using IRSA
#                         (no static AWS keys).
# NOTE: the API URL is baked into the SPA at build time (VITE_BASE_API_URL). The
# published image defaults to a relative `/api/v1/` (correct for bundle mode).
# For cloudfront (frontend on a separate domain) rebuild with an absolute URL.
frontend:
  image:
    repository: ghcr.io/hotosm/fair-frontend
    tag: ""  # defaults to appVersion
    pullPolicy: IfNotPresent
  runtimeEnv: {}

  mode: "bundleWithBackend"

  # Settings for mode: cloudfront
  cloudfront:
    roleArn: ""  # IAM role ARN for IRSA (annotated onto the ServiceAccount)
    region: "us-east-1"
    s3Bucket: ""  # Required, e.g. "fair-frontend"
    version: ""  # S3 path prefix; defaults to appVersion. Set to an older value to rollback.
    aliases: []  # e.g. ["fair.hotosm.org"]; only used when creating a new distribution
    acmCertificateArn: ""  # Required when aliases are set
    priceClass: "PriceClass_All"
    awsCliImage:
      repository: docker.io/amazon/aws-cli
      tag: "2.34.17"
      pullPolicy: IfNotPresent

# -- Ingress configuration. In bundleWithBackend mode the backend serves both the
# SPA (`/`) and API (`/api`). In cloudfront mode point the ingress at `/api`.
ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: fair.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: fair-tls
  #    hosts:
  #      - fair.example.com

# -- External PostgreSQL connection. Used when `postgres.enabled` is false
# (the production path). Prefer supplying credentials via `existingSecret`.
externalDatabase:
  host: ""
  port: 5432
  database: ai
  username: postgres
  password: ""
  existingSecret: ""
  existingSecretKey: password

# Bundled single-pod Postgres for staging / PR-preview / local dev. Disabled
# by default - production deployments should point at a managed database via
# `externalDatabase`. When enabled, the chart provisions a Postgres
# StatefulSet and injects DATABASE_URL into the backend Deployment and
# migration Job, overriding anything from `externalDatabase`. Uses the
# PostGIS image because the app validates a `postgis://` DATABASE_URL.
postgres:
  enabled: false
  image:
    repository: docker.io/postgis/postgis
    tag: "17-3.5-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: fair
    password: fair
    database: fair
  service:
    port: 5432
  persistence:
    enabled: false
    size: 5Gi
    storageClassName: ""
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
