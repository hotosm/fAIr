{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fair.serviceAccountName" . }}
  labels:
    {{- include "fair.labels" . | nindent 4 }}
  {{- $irsa := and (eq (.Values.frontend.mode | default "bundleWithBackend") "cloudfront") .Values.frontend.cloudfront.roleArn }}
  {{- if or .Values.serviceAccount.annotations $irsa }}
  annotations:
    {{- if $irsa }}
    # IRSA: lets the CloudFront deploy Job assume the IAM role without static keys.
    eks.amazonaws.com/role-arn: {{ .Values.frontend.cloudfront.roleArn | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
