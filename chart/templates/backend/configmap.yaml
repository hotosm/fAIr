apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fair.backend.fullname" . }}
  labels:
    {{- include "fair.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    {{- include "fair.syncWave" "-10" | nindent 4 }}
data:
  {{- if eq (.Values.frontend.mode | default "bundleWithBackend") "bundleWithBackend" }}
  # Serve the SPA, copied in by the frontend-assets init container, via Django/WhiteNoise.
  SERVE_FRONTEND: "true"
  {{- end }}
  {{- if not .Values.postgres.enabled }}
  # Expanded into DATABASE_URL as $(DATABASE_USER).
  DATABASE_USER: {{ .Values.externalDatabase.username | quote }}
  {{- end }}
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
