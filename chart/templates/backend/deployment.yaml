{{- $bundle := eq (.Values.frontend.mode | default "bundleWithBackend") "bundleWithBackend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fair.backend.fullname" . }}
  labels:
    {{- include "fair.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backendReplicaCount }}
  selector:
    matchLabels:
      {{- include "fair.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend/configmap.yaml") . | sha256sum }}
      {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "fair.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fair.serviceAccountName" . }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $bundle }}
      initContainers:
        # Copies the built SPA into the shared volume the API pod serves via
        # Django/WhiteNoise (SERVE_FRONTEND=true, see configmap).
        - name: frontend-assets
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          volumeMounts:
            - name: frontend-html
              mountPath: /frontend_html
          env:
            {{- range $k, $v := (.Values.frontend.runtimeEnv | default dict) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "fair.backend.image" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          {{- with .Values.backend.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "fair.backend.fullname" . }}
            {{- with .Values.backend.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.postgres.enabled }}
            {{- include "fair.postgresDatabaseUrlEnv" . | nindent 12 }}
            {{- else }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.externalDatabase.existingSecret }}
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingSecretKey }}
                  {{- else }}
                  name: {{ include "fair.backend.fullname" . }}-db
                  key: password
                  {{- end }}
            - name: DATABASE_URL
              value: {{ include "fair.databaseUrl" . | quote }}
            {{- end }}
          {{- if $bundle }}
          volumeMounts:
            - name: frontend-html
              mountPath: /app/frontend_html
              readOnly: true
          {{- end }}
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.backend.djangoQ.enabled }}
        - name: django-q
          image: {{ include "fair.backend.image" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            - python
            - manage.py
            - qcluster
          envFrom:
            - configMapRef:
                name: {{ include "fair.backend.fullname" . }}
            {{- with .Values.backend.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.postgres.enabled }}
            {{- include "fair.postgresDatabaseUrlEnv" . | nindent 12 }}
            {{- else }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.externalDatabase.existingSecret }}
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingSecretKey }}
                  {{- else }}
                  name: {{ include "fair.backend.fullname" . }}-db
                  key: password
                  {{- end }}
            - name: DATABASE_URL
              value: {{ include "fair.databaseUrl" . | quote }}
            {{- end }}
          {{- with .Values.backend.djangoQ.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if $bundle }}
      volumes:
        - name: frontend-html
          emptyDir: {}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
