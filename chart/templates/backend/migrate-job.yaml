{{- if .Values.backend.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  # Job specs are immutable, so use a new name for each Helm revision.
  name: {{ include "fair.migrateJobName" . }}
  labels:
    {{- include "fair.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    # Argo CD: dependencies (-10), migration (-5), workloads (0).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- include "fair.syncWave" "-5" | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "fair.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fair.serviceAccountName" . }}
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "fair.backend.image" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command:
            - python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - configMapRef:
                name: {{ include "fair.backend.fullname" . }}
            {{- with .Values.backend.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.postgres.enabled }}
            {{- include "fair.postgresDatabaseUrlEnv" . | nindent 12 }}
            {{- else }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.externalDatabase.existingSecret }}
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingSecretKey }}
                  {{- else }}
                  name: {{ include "fair.backend.fullname" . }}-db
                  key: password
                  {{- end }}
            - name: DATABASE_URL
              value: {{ include "fair.databaseUrl" . | quote }}
            {{- end }}
{{- end }}
